# The cart API.
#
# Three things here are load-bearing beyond "it runs":
#
#   app.kubernetes.io/name: cart   joins this workload back to the `cart` service
#                                  in Port (naming contract, plan.md §7)
#   resources.limits set           the namespace ResourceQuota REJECTS pods with
#                                  no requests; the tenant LimitRange would
#                                  supply defaults, but a service this critical
#                                  states its own
#   image pinned to 1.27-alpine    never :latest — an unpinned tag makes the
#                                  running version unknowable, and the
#                                  production-readiness scorecard checks it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/part-of: checkout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cart
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            # nginx writes proxy temp files here at startup; with a read-only
            # root filesystem it needs somewhere real to put them.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
