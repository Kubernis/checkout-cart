# app.kubernetes.io/name is the join key back to the `cart` service in Port.
# Do not rename it without changing the naming contract.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service }}
  labels:
    app.kubernetes.io/name: {{ .Values.service }}
    app.kubernetes.io/part-of: {{ .Values.team }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.service }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.service }}
        app.kubernetes.io/part-of: {{ .Values.team }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.service }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be pinned — never latest" .Values.image.tag }}"
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /var/run }
            # nginx writes proxy temp dirs at startup; with a read-only root
            # filesystem it needs somewhere real to put them.
            - { name: tmp,   mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run,   emptyDir: {} }
        - { name: tmp,   emptyDir: {} }
